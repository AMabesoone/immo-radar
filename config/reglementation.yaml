# Contraintes reglementaires par commune (mises a jour a la main, voir docs/research/03-operationnel-reglementaire.md).
# changement_usage : autorisation de changement d'usage exigee pour louer une residence secondaire en meuble de tourisme
# compensation : obligation de compenser (transformer un local commercial en logement) => courte duree quasi impossible
# quota : la commune a instaure des quotas ou zones d'interdiction (loi Le Meur)
# encadrement_loyers : encadrement des loyers en vigueur (loyer de reference majore a verifier)
# th_secondaire_majoration : majoration de taxe d'habitation sur les residences secondaires (0.6 = +60 %)
# zone_tendue : commune en zone tendue (tension locative, bail reduit, surtaxe)

defaut:
  changement_usage: false
  compensation: false
  quota: false
  encadrement_loyers: false
  th_secondaire_majoration: 0.0
  zone_tendue: false

