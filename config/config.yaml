# Immo Radar : configuration principale.
# Tous les montants sont en euros, tous les taux en fraction (0.03 = 3 %).
# Les valeurs par defaut viennent de la synthese de recherche (docs/research/).
# Un onglet "Parametres" dans le Google Sheet peut surcharger n'importe quelle cle
# avec la notation pointee (ex: "financement.taux_20_ans" -> 0.031).

recherche:
  # Villes ou zones a scanner. "zone" = requete envoyee a la geocodification Bien'ici.
  # categorie : metropole | grande_ville | ville_moyenne | touristique | petite_ville
  # Elle pilote les hypotheses par defaut (occupation courte duree, vacance, tension).
  # Cibles du premier achat : Nord (59), Pas-de-Calais (62) et Ile-de-France (75, 77, 78, 91, 92, 93, 94, 95).
  # L'ancienne liste France entiere est conservee dans villes_desactivees (deplacer des lignes vers villes pour les reactiver).
  # cp (facultatif) : code postal pour lever une homonymie (Saint-Denis 93 et non La Reunion).
