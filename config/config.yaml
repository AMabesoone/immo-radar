    - { zone: "Vitry-sur-Seine", categorie: ville_moyenne }
    - { zone: "Villejuif", categorie: ville_moyenne }
    - { zone: "Creteil", categorie: ville_moyenne }
    - { zone: "Champigny-sur-Marne", categorie: ville_moyenne }
    - { zone: "Nanterre", categorie: ville_moyenne }
    - { zone: "Colombes", categorie: ville_moyenne }
    - { zone: "Gennevilliers", categorie: ville_moyenne }
    - { zone: "Asnieres-sur-Seine", categorie: ville_moyenne }
