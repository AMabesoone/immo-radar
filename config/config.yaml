    - { zone: "Bethune", categorie: ville_moyenne }
    - { zone: "Calais", categorie: ville_moyenne }
    - { zone: "Boulogne-sur-Mer", categorie: ville_moyenne }
    - { zone: "Saint-Omer", categorie: petite_ville }
    - { zone: "Berck", categorie: touristique }
    - { zone: "Le Touquet-Paris-Plage", categorie: touristique }
    - { zone: "Wimereux", categorie: touristique }
    # Ile-de-France : Paris + communes de petite et grande couronne ou le rendement brut peut depasser 6 %
