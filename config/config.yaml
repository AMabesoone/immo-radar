    - { zone: "Aubervilliers", categorie: ville_moyenne }
    - { zone: "Saint-Ouen-sur-Seine", categorie: ville_moyenne }
    - { zone: "Pantin", categorie: ville_moyenne }
    - { zone: "Montreuil", cp: "93100", categorie: grande_ville }
    - { zone: "Bobigny", categorie: ville_moyenne }
    - { zone: "Bondy", categorie: ville_moyenne }
    - { zone: "Noisy-le-Sec", categorie: ville_moyenne }
    - { zone: "Drancy", categorie: ville_moyenne }
