    # Nord et Pas-de-Calais
    - { zone: "Lille", categorie: grande_ville }
    - { zone: "Roubaix", categorie: ville_moyenne }
    - { zone: "Tourcoing", categorie: ville_moyenne }
    - { zone: "Villeneuve-d'Ascq", categorie: ville_moyenne }
    - { zone: "Wattrelos", categorie: ville_moyenne }
    - { zone: "Lambersart", categorie: ville_moyenne }
    - { zone: "Marcq-en-Baroeul", categorie: ville_moyenne }
    - { zone: "Dunkerque", categorie: ville_moyenne }
    - { zone: "Valenciennes", categorie: ville_moyenne }
    - { zone: "Douai", categorie: ville_moyenne }
    - { zone: "Cambrai", categorie: ville_moyenne }
